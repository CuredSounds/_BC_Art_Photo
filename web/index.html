<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BC Art Photo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>BC Art Photo</h1>
    <section class="toolbar">
      <label>Tool
        <select id="tool">
          <option value="brush">Brush</option>
          <option value="eraser">Eraser</option>
          <option value="line">Line</option>
          <option value="rectangle">Rectangle</option>
        </select>
      </label>
      <label>Color <input id="color" type="color" value="#000000" /></label>
      <label>Size <input id="size" type="range" min="1" max="50" value="5" /></label>
      <input id="upload" type="file" accept="image/*" />
      <button id="grayscale">Grayscale</button>
      <button id="invert">Invert</button>
      <button id="reset">Reset Filters</button>
      <button id="save">Save PNG</button>
    </section>

    <section class="adjustments">
      <label>Brightness <input id="brightness" type="range" min="0" max="200" value="100" /></label>
      <label>Contrast <input id="contrast" type="range" min="0" max="200" value="100" /></label>
      <label>Saturation <input id="saturation" type="range" min="0" max="200" value="100" /></label>
    </section>

    <canvas id="canvas" width="1024" height="640"></canvas>
  </main>

  <script src="app.js"></script>
</body>
</html>
